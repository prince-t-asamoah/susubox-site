<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"></helmet>
<form style="display:flex;flex-direction:column;gap:24px;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;color:#1B1B1B">
<div style="display:flex;flex-direction:column;gap:8px">
<label style="font-size:16px;font-weight:700;line-height:1.4">Full name</label>
<div style="min-height:48px;box-sizing:border-box;border:1px solid #7C8C84;border-radius:12px;padding:11px 16px;font-size:16px;line-height:1.6;background:#FFFFFF">{{ v.name }}</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<label style="font-size:16px;font-weight:700;line-height:1.4">Phone number</label>
<span style="font-size:14px;line-height:1.5;color:#5A5A5A;margin-top:-4px">e.g. 024 123 4567 or +233 24 123 4567</span>
<sc-if value="{{ phoneOk }}" hint-placeholder-val="{{ true }}">
<div style="min-height:48px;box-sizing:border-box;border:1px solid #7C8C84;border-radius:12px;padding:11px 16px;font-size:16px;line-height:1.6;background:#FFFFFF">{{ v.phone }}</div>
</sc-if>
<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
<div aria-invalid="true" style="min-height:48px;box-sizing:border-box;border:2px solid #B3261E;border-radius:12px;padding:10px 15px;font-size:16px;line-height:1.6;background:#FFFFFF">{{ v.phone }}</div>
<div aria-live="polite" style="display:flex;gap:8px;align-items:flex-start;color:#B3261E;font-size:16px;line-height:1.5"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5M12 16.5v.01"></path></svg><span>Enter a Ghana phone number, e.g. 024 123 4567</span></div>
<span style="align-self:flex-start;font:600 11px/1.4 ui-monospace,Menlo,monospace;color:#C2185B;border:1px dashed #C2185B;border-radius:4px;padding:2px 6px">TODO: error copy not in spec</span>
</sc-if>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<label style="font-size:16px;font-weight:700;line-height:1.4">Email (optional)</label>
<div style="min-height:48px;box-sizing:border-box;border:1px solid #7C8C84;border-radius:12px;padding:11px 16px;font-size:16px;line-height:1.6;background:#FFFFFF">{{ v.email }}</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<label style="font-size:16px;font-weight:700;line-height:1.4">I am a…</label>
<div style="min-height:48px;box-sizing:border-box;border:1px solid #7C8C84;border-radius:12px;padding:11px 12px 11px 16px;font-size:16px;line-height:1.6;background:#FFFFFF;display:flex;align-items:center;justify-content:space-between;gap:8px"><span>{{ v.role }}</span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1B1B1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<label style="font-size:16px;font-weight:700;line-height:1.4">Market or town</label>
<div style="min-height:48px;box-sizing:border-box;border:1px solid #7C8C84;border-radius:12px;padding:11px 16px;font-size:16px;line-height:1.6;background:#FFFFFF">{{ v.market }}</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<label style="font-size:16px;font-weight:700;line-height:1.4">Message</label>
<div style="min-height:152px;box-sizing:border-box;border:1px solid #7C8C84;border-radius:12px;padding:11px 16px;font-size:16px;line-height:1.6;background:#FFFFFF">{{ v.message }}</div>
</div>
<sc-if value="{{ isFailed }}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid #B3261E;border-radius:12px;background:#FCEDEC;font-size:16px;line-height:1.5"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5M12 16.5v.01"></path></svg><span>Something went wrong. Please try again or <a href="#" style="color:#0B6E4F;font-weight:700;text-decoration:underline;text-underline-offset:3px">message us on WhatsApp</a>.</span></div>
</sc-if>
<sc-if value="{{ notSending }}" hint-placeholder-val="{{ true }}">
<button type="button" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;border:0;border-radius:12px;background:#0B6E4F;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:700;line-height:1.5;cursor:pointer">Send message</button>
</sc-if>
<sc-if value="{{ isSending }}" hint-placeholder-val="{{ false }}">
<button type="button" disabled="" aria-disabled="true" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;border:0;border-radius:12px;background:#E4EAE6;color:#5A5A5A;font-family:inherit;font-size:16px;font-weight:700;line-height:1.5;cursor:not-allowed"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>Sending…</button>
</sc-if>
</form>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:900},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;empty&quot;,&quot;error&quot;,&quot;sending&quot;,&quot;failed&quot;],&quot;default&quot;:&quot;empty&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'empty';
    const blank = { name: '', phone: '', email: '', role: '', market: '', message: '' };
    const full = { name: 'Kwabena Owusu', phone: '024 123 4567', email: '', role: 'Susu collector', market: 'Kejetia Market, Kumasi', message: 'I collect susu from 40 traders at Kejetia. Can they all get a weekly statement?' };
    const v = (s === 'sending' || s === 'failed') ? full : s === 'error' ? { ...blank, name: 'Kwabena Owusu', phone: '24 123 456' } : blank;
    return { v, isError: s === 'error', phoneOk: s !== 'error', isSending: s === 'sending', notSending: s !== 'sending', isFailed: s === 'failed' };
  }
}
</script>
</body>
</html>
