<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"></helmet>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ false }}">
<header style="position:sticky;top:0;z-index:40;background:#FFFFFF;border-bottom:1px solid #DDE5E0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<div style="max-width:1152px;margin:0 auto;padding:0 32px;height:72px;display:flex;align-items:center;justify-content:space-between">
<a href="#" style="display:flex;align-items:center;min-height:48px;font-size:22px;font-weight:700;color:#0B6E4F;text-decoration:none;letter-spacing:-0.01em">SusuBox</a>
<nav style="display:flex;gap:8px">
<a href="#" style="display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:12px;color:#1B1B1B;font-size:16px;text-decoration:none">How it works</a>
<a href="#" style="display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:12px;color:#1B1B1B;font-size:16px;text-decoration:none">FAQ</a>
<sc-if value="{{ isContact }}" hint-placeholder-val="{{ false }}"><a href="#" aria-current="page" style="display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:12px;color:#0B6E4F;font-size:16px;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px">Contact</a></sc-if>
<sc-if value="{{ notContact }}" hint-placeholder-val="{{ true }}"><a href="#" style="display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:12px;color:#1B1B1B;font-size:16px;text-decoration:none">Contact</a></sc-if>
</nav>
</div>
</header>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ true }}">
<header style="position:sticky;top:0;z-index:40;background:#FFFFFF;border-bottom:1px solid #DDE5E0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<div style="height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between">
<a href="#" style="display:flex;align-items:center;min-height:48px;font-size:20px;font-weight:700;color:#0B6E4F;text-decoration:none;letter-spacing:-0.01em">SusuBox</a>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div role="button" aria-expanded="true" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;box-sizing:border-box;border:1px solid #7C8C84;border-radius:12px;background:#F4F7F5;font-size:16px;font-weight:700;color:#1B1B1B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>Menu</div>
</sc-if>
<sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}">
<div role="button" aria-expanded="false" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;box-sizing:border-box;border:1px solid #7C8C84;border-radius:12px;background:#FFFFFF;font-size:16px;font-weight:700;color:#1B1B1B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>Menu</div>
</sc-if>
</div>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<nav style="position:absolute;left:0;right:0;top:100%;background:#FFFFFF;border-bottom:1px solid #DDE5E0;box-shadow:0 12px 24px rgba(27,27,27,.12);padding:8px 16px 24px;display:flex;flex-direction:column;max-height:680px;overflow-y:auto">
<a href="#" style="display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid #DDE5E0;color:#1B1B1B;font-size:18px;font-weight:700;text-decoration:none">How it works<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
<a href="#" style="display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid #DDE5E0;color:#1B1B1B;font-size:18px;font-weight:700;text-decoration:none">FAQ<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
<a href="#" style="display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid #DDE5E0;color:#1B1B1B;font-size:18px;font-weight:700;text-decoration:none">Contact<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
</nav>
</sc-if>
</header>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:300},&quot;desktop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const d = !!this.props.desktop, o = !!this.props.open, c = this.props.current === 'contact';
    return { desktop: d, mobile: !d, open: o, closed: !o, isContact: c, notContact: !c };
  }
}
</script>
</body>
</html>
