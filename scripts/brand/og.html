<!doctype html>
<!--
  Source for public/og.jpg (1200×630). Regenerate by opening this file in Chrome at a
  1200×630 viewport and saving a JPEG screenshot (≤ 120 KB), e.g. with Playwright:
  page.setViewportSize({ width: 1200, height: 630 }); page.screenshot({ type: "jpeg", quality: 85 })
  Copy is from SPEC.md §6.1. No sample figures (SHARED-STANDARDS §8).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url("../../public/fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: Inter; font-weight: 700; src: url("../../public/fonts/inter-700.woff2") format("woff2"); }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 88px 96px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: #0B6E4F; color: #fff; font-family: Inter, sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 44px; font-weight: 700; letter-spacing: -0.01em; }
  .brand img { width: 72px; height: 72px; border-radius: 16px; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
  h1 { margin: 0; max-width: 15em; font-size: 72px; line-height: 1.08; letter-spacing: -0.025em; }
  p { margin: 0; font-size: 30px; opacity: .9; }
  .eyebrow { display: inline-block; padding: 6px 18px; border-radius: 999px; background: #F2A900; color: #1B1B1B;
    font-size: 22px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="brand"><img src="../../public/favicon.svg" alt="">SusuBox</div>
  <div>
    <span class="eyebrow">For market traders in Ghana</span>
    <h1 style="margin-top:24px">Your daily susu, recorded on WhatsApp</h1>
  </div>
  <p>No app to download · Works on any phone with WhatsApp</p>
</body>
</html>
